<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>نظام إعداد التقارير</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- الصفحة الرئيسية -->

    <section id="home" class="home-page">

        <div class="home-content">

            <div class="logo">📄</div>

            <h1>نظام إعداد التقارير</h1>

            <p>

                أنشئ تقريرك المدرسي بطريقة سهلة ومرتبة،

                ثم حوّله إلى ملف PDF جاهز للتحميل والطباعة.

            </p>

            <button onclick="showReport()">

                ابدأ إنشاء التقرير

            </button>

        </div>

    </section>

    <!-- نموذج التقرير -->

    <section id="reportPage">

        <div class="container">

            <!-- الشعار وبيانات المدرسة -->

            <div class="school-header">

                <div class="logo-area">

                    <img src="logo.jpg" alt="شعار وزارة التعليم">

                </div>

                <div class="school-info">

                    <div>المملكة العربية السعودية</div>

                    <div>وزارة التعليم</div>

                    <div>الإدارة العامة للتعليم بجدة</div>

                    <div>الابتدائية الثانية عشرة والروضة الملحقة</div>

                </div>

            </div>

            <h1>نموذج إعداد التقرير</h1>

            <p>يرجى تعبئة البيانات التالية</p>

            <form id="reportForm">

                <!-- عنوان التقرير -->

                <div class="form-group">

                    <label>عنوان التقرير</label>

                    <input type="text" id="title" required>

                </div>

                <!-- اسم العملية + اليوم -->

                <div class="form-row">

                    <div class="form-group">

                        <label>اسم العملية</label>

                        <input type="text" id="process" placeholder="أدخل بيانات العملية">

                    </div>

                    <div class="form-group">

                        <label>اليوم</label>

                        <input type="text" id="day" placeholder="أدخل اليوم">

                    </div>

                </div>

                <!-- التاريخ + الفئة المستهدفة -->

                <div class="form-row">

                    <div class="form-group">

                        <label>التاريخ</label>

                        <input type="date" id="date">

                    </div>

                    <div class="form-group">

                        <label>الفئة المستهدفة</label>

                        <input type="text" id="target" placeholder="أدخل الفئة المستهدفة">

                    </div>

                </div>

                <!-- عدد المستهدفين + الهدف -->

                <div class="form-row">

                    <div class="form-group">

                        <label>عدد المستهدفين</label>

                        <input type="number" id="targetCount" placeholder="أدخل العدد">

                    </div>

                    <div class="form-group">

                        <label>الهدف</label>

                        <textarea id="goal" placeholder="اكتب الهدف هنا"></textarea>

                    </div>

                </div>

                <!-- الملاحظات + الإجراءات -->

                <div class="form-row">

                    <div class="form-group">

                        <label>الملاحظات</label>

                        <textarea id="notes" placeholder="اكتب الملاحظات هنا"></textarea>

                    </div>

                    <div class="form-group">

                        <label>الإجراءات</label>

                        <textarea id="procedures" placeholder="اكتب الإجراءات هنا"></textarea>

                    </div>

                </div>

                <!-- التوصيات -->

                <div class="form-group">

                    <label>التوصيات</label>

                    <textarea id="recommendations" placeholder="اكتب التوصيات هنا"></textarea>

                </div>
                <!-- الشواهد -->

                <div class="form-group">

                    <label>الشواهد (صور)</label>

<div id="imageInputs">

    <div class="image-input">

        <input type="file" class="evidenceImage" accept="image/*">

    </div>

</div>

<button type="button" onclick="addImageInput()">

    ➕ إضافة صورة أخرى

</button>

                </div>

                <!-- معد التقرير + مديرة المدرسة -->

                <div class="form-row">

                    <div class="form-group">

                        <label>معد التقرير</label>

                        <input type="text" id="reportWriter" placeholder="اسم معد التقرير">

                    </div>

                    <div class="form-group">

                        <label>مديرة المدرسة</label>

                        <input type="text" id="schoolPrincipal" placeholder="اسم مديرة المدرسة">

                    </div>

                </div>

                <!-- زر إنشاء التقرير -->

                <button type="button" onclick="createPDF()">

                    📄 إنشاء التقرير PDF

                </button>

            </form>

        </div>

    </section>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script src="script.js"></script>

</body>

</html>
